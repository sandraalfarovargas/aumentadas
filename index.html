  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px\">\n<a href=\"#inicio\" style=\"font-family: 'Bricolage Grotesque', 'Public Sans', sans-serif; font-weight: 800; font-size: 28px; color: #1d2b3a; text-decoration: none; letter-spacing: -0.5px\">Aumentadas<\u002Fa>\n<nav aria-label=\"Principal\" style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 24px\">\n<a href=\"#camino\" style=\"color: #1d2b3a; text-decoration: none; font-weight: 500\">Cómo funciona<\u002Fa>\n<a href=\"#becas\" style=\"color: #1d2b3a; text-decoration: none; font-weight: 500\">Becas<\u002Fa>\n<a href=\"#fundadora\" style=\"color: #1d2b3a; text-decoration: none; font-weight: 500\">Sobre mí<\u002Fa>\n<a href=\"https://docs.google.com/forms/d/1gylqDV1QrIksuEPeacNqh10lhUTttoYInnpJ0mE20uY/viewform\" target=\"_blank\" rel=\"noopener\" style=\"display: inline-flex; align-items: center; min-height: 48px; padding: 0 24px; border-radius: 999px; background: {{accent}}; color: #ffffff; text-decoration: none; font-weight: 700\">Postula a tu beca<\u002Fa>\n<\u002Fnav>\n<\u002Fheader>\n\n<section id=\"inicio\" style=\"max-width: 1200px; margin: 0 auto; padding: 64px 32px 96px; display: flex; flex-wrap: wrap; align-items: center; gap: 64px\">\n<div style=\"flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 28px\">\n<p style=\"margin: 0; font-size: 15px; font-weight: 700; letter-spacing: 2px; color: #17766d\">BECAS 2027 · LABORATORIO PRESENCIAL EN VALENCIA<\u002Fp>\n<h1 style=\"margin: 0; font-family: 'Bricolage Grotesque', 'Public Sans', sans-serif; font-weight: 800; font-size: clamp(44px, 6vw, 80px); line-height: 1.02; letter-spacing: -2px\">Cruzaste una frontera. Tu talento vino contigo.<\u002Fh1>\n<p style=\"margin: 0; font-size: 21px; max-width: 600px; color: #3a4856\">Aumentadas es el laboratorio donde profesionales latinoamericanas en España convierten su experiencia en un proyecto propio, co-creado con inteligencia artificial. Sin saber programar. Sin empezar de cero.<\u002Fp>\n<div style=\"display: flex; flex-wrap: wrap; gap: 16px; align-items: center\">\n<a href=\"https://docs.google.com/forms/d/1gylqDV1QrIksuEPeacNqh10lhUTttoYInnpJ0mE20uY/viewform\" target=\"_blank\" rel=\"noopener\" style=\"display: inline-flex; align-items: center; min-height: 56px; padding: 0 32px; border-radius: 999px; background: {{accent}}; color: #ffffff; text-decoration: none; font-weight: 700; font-size: 18px\">Postula a tu beca<\u002Fa>\n<a href=\"#camino\" style=\"display: inline-flex; align-items: center; min-height: 56px; padding: 0 28px; border-radius: 999px; border: 2px solid #1d2b3a; color: #1d2b3a; text-decoration: none; font-weight: 700; font-size: 18px\">Ver cómo funciona<\u002Fa>\n<\u002Fdiv>\n<p style=\"margin: 0; font-size: 15px; color: #4f5d6a\">Becas parciales y completas para la primera cohorte · 12 minutos para postular<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex: 1 1 360px; min-width: 0; display: flex; align-items: center; justify-content: center; min-height: 460px; padding: 40px 0\">\n<div style=\"position: relative; width: 340px; max-width: 86%\">\n<div style=\"position: absolute; left: -70px; top: -80px; width: 260px; height: 260px; border-radius: 50%; background: #1f8f84\"><\u002Fdiv>\n<div style=\"position: absolute; right: -50px; bottom: -60px; width: 160px; height: 160px; border-radius: 50%; background: #f07c69\"><\u002Fdiv>\n<div style=\"position: absolute; right: -30px; top: -40px; width: 90px; height: 90px; border-radius: 50%; background: #e2b052\"><\u002Fdiv>\n<div style=\"position: relative; background: #1d2b3a; color: #f8f5ef; border-radius: 28px; padding: 40px 36px; display: flex; flex-direction: column; gap: 18px; box-shadow: 0 24px 48px rgba(29, 43, 58, 0.25)\">\n<p style=\"margin: 0; font-family: 'Bricolage Grotesque', 'Public Sans', sans-serif; font-weight: 800; font-size: 34px; line-height: 1.12\">No enseño IA. Enseño a pensar con IA.<\u002Fp>\n<p style=\"margin: 0; font-size: 15px; color: #c9d3dc\">Sandra Alfaro Vargas, fundadora<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"por-que\" style=\"background: #ffffff; padding: 96px 32px\">\n<div style=\"max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 48px\">\n<div style=\"display: flex; flex-direction: column; gap: 20px; max-width: 760px\">\n<p style=\"margin: 0; font-size: 15px; font-weight: 700; letter-spacing: 2px; color: #17766d\">LA REALIDAD<\u002Fp>\n<h2 style=\"margin: 0; font-family: 'Bricolage Grotesque', 'Public Sans', sans-serif; font-weight: 800; font-size: clamp(34px, 4vw, 54px); line-height: 1.08; letter-spacing: -1px\">El talento no desaparece al migrar.<\u002Fh2>\n<p style=\"margin: 0; font-size: 20px; color: #3a4856\">Llegaste con años de experiencia. Aquí, la homologación, los contactos o el idioma local te cerraron puertas. No te falta talento. Te falta un camino.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 24px\">\n<div style=\"background: #f8f5ef; border-radius: 24px; padding: 32px; display: flex; flex-direction: column; gap: 12px\">\n<p style=\"margin: 0; font-family: 'Bricolage Grotesque', 'Public Sans', sans-serif; font-weight: 800; font-size: 44px; color: #1f8f84; line-height: 1\">01<\u002Fp>\n<h3 style=\"margin: 0; font-size: 22px\">Tu experiencia no se reconoce<\u002Fh3>\n<p style=\"margin: 0; color: #4f5d6a\">Estudios y trayectoria que aquí parecen no contar.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background: #f8f5ef; border-radius: 24px; padding: 32px; display: flex; flex-direction: column; gap: 12px\">\n<p style=\"margin: 0; font-family: 'Bricolage Grotesque', 'Public Sans', sans-serif; font-weight: 800; font-size: 44px; color: #d35a45; line-height: 1\">02<\u002Fp>\n<h3 style=\"margin: 0; font-size: 22px\">Las barreras son reales<\u002Fh3>\n<p style=\"margin: 0; color: #4f5d6a\">Trámites, redes, idioma local y recursos limitados.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background: #f8f5ef; border-radius: 24px; padding: 32px; display: flex; flex-direction: column; gap: 12px\">\n<p style=\"margin: 0; font-family: 'Bricolage Grotesque', 'Public Sans', sans-serif; font-weight: 800; font-size: 44px; color: #b8862a; line-height: 1\">03<\u002Fp>\n<h3 style=\"margin: 0; font-size: 22px\">Pero no quieres renunciar<\u002Fh3>\n<p style=\"margin: 0; color: #4f5d6a\">Quieres volver a ejercer tu talento y crear algo propio.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"background: #1d2b3a; color: #f8f5ef; padding: 96px 32px\">\n<div style=\"max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 48px\">\n<h2 style=\"margin: 0; font-family: 'Bricolage Grotesque', 'Public Sans', sans-serif; font-weight: 800; font-size: clamp(34px, 4vw, 54px); line-height: 1.08; letter-spacing: -1px; max-width: 900px\">De \"mi experiencia no encaja\" a \"puedo crear algo propio\".<\u002Fh2>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px\">\n<div style=\"background: #26384a; border-radius: 24px; padding: 36px; display: flex; flex-direction: column; gap: 12px\">\n<p style=\"margin: 0; font-size: 15px; font-weight: 700; letter-spacing: 2px; color: #f4a294\">ANTES<\u002Fp>\n<p style=\"margin: 0; font-size: 20px; color: #d6dde3\">Desorientación profesional. Un trabajo que no te representa. Poca red de apoyo. Dudas sobre cómo empezar.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background: #26384a; border-radius: 24px; padding: 36px; display: flex; flex-direction: column; gap: 12px\">\n<p style=\"margin: 0; font-size: 15px; font-weight: 700; letter-spacing: 2px; color: #7fd0c6\">DESPUÉS<\u002Fp>\n<p style=\"margin: 0; font-size: 20px; color: #d6dde3\">Reconoces tu talento y tu trayectoria. Creas con IA una solución a un problema. Consigues que personas reales la usen y adquieran tus servicios. Creas comunidad de mujeres migrantes competentes.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"metodo\" style=\"padding: 96px 32px\">\n<div style=\"max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 48px\">\n<div style=\"display: flex; flex-direction: column; gap: 20px; max-width: 760px\">\n<p style=\"margin: 0; font-size: 15px; font-weight: 700; letter-spacing: 2px; color: #17766d\">EL MÉTODO<\u002Fp>\n<h2 style=\"margin: 0; font-family: 'Bricolage Grotesque', 'Public Sans', sans-serif; font-weight: 800; font-size: clamp(34px, 4vw, 54px); line-height: 1.08; letter-spacing: -1px\">Primero tu propio reconocimiento. Después tu producto.<\u002Fh2>\n<p style=\"margin: 0; font-size: 20px; color: #3a4856\">La IA no te reemplaza. Te expande. Trabajamos desde lo que ya sabes hacer.<\u002Fp>\n<\u002Fdiv>\n<ol style=\"margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 20px\">\n<li style=\"background: #ffffff; border-radius: 24px; padding: 28px; display: flex; flex-direction: column; gap: 8px\"><span style=\"font-weight: 700; color: #17766d\">01<\u002Fspan><strong style=\"font-size: 20px\">Experiencia<\u002Fstrong><span style=\"color: #4f5d6a\">Reconoce lo que ya sabes hacer.<\u002Fspan><\u002Fli>\n<li style=\"background: #ffffff; border-radius: 24px; padding: 28px; display: flex; flex-direction: column; gap: 8px\"><span style=\"font-weight: 700; color: #17766d\">02<\u002Fspan><strong style=\"font-size: 20px\">Problema<\u002Fstrong><span style=\"color: #4f5d6a\">Descubre a quién puedes ayudar.<\u002Fspan><\u002Fli>\n<li style=\"background: #ffffff; border-radius: 24px; padding: 28px; display: flex; flex-direction: column; gap: 8px\"><span style=\"font-weight: 700; color: #17766d\">03<\u002Fspan><strong style=\"font-size: 20px\">Idea<\u002Fstrong><span style=\"color: #4f5d6a\">Diseña tu solución.<\u002Fspan><\u002Fli>\n<li style=\"background: #ffffff; border-radius: 24px; padding: 28px; display: flex; flex-direction: column; gap: 8px\"><span style=\"font-weight: 700; color: #17766d\">04<\u002Fspan><strong style=\"font-size: 20px\">IA + creación<\u002Fstrong><span style=\"color: #4f5d6a\">Construye tu primer producto.<\u002Fspan><\u002Fli>\n<li style=\"background: #ffffff; border-radius: 24px; padding: 28px; display: flex; flex-direction: column; gap: 8px\"><span style=\"font-weight: 700; color: #17766d\">05<\u002Fspan><strong style=\"font-size: 20px\">Uso real<\u002Fstrong><span style=\"color: #4f5d6a\">Pruébalo con personas reales y genera ingresos.<\u002Fspan><\u002Fli>\n<\u002Fol>\n<p style=\"margin: 0; font-size: 22px; font-weight: 700; max-width: 820px\">El foco no es dominar herramientas. Es crear algo que una persona real necesite usar, como producto en sí mismo o como complemento de tus servicios profesionales.<\u002Fp>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"background: #ffffff; padding: 96px 32px\">\n<div style=\"max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 48px\">\n<div style=\"display: flex; flex-direction: column; gap: 20px; max-width: 760px\">\n<p style=\"margin: 0; font-size: 15px; font-weight: 700; letter-spacing: 2px; color: #17766d\">QUÉ PUEDES CREAR<\u002Fp>\n<h2 style=\"margin: 0; font-family: 'Bricolage Grotesque', 'Public Sans', sans-serif; font-weight: 800; font-size: clamp(34px, 4vw, 54px); line-height: 1.08; letter-spacing: -1px\">No tiene que ser un curso.<\u002Fh2>\n<p style=\"margin: 0; font-size: 20px; color: #3a4856\">La propuesta no limita la creación a cursos ni a productos exclusivamente digitales. Las participantes podrán explorar distintas soluciones según su experiencia, las necesidades de sus potenciales usuarios y sus recursos.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 24px\">\n<div style=\"background: #f8f5ef; border-radius: 24px; padding: 32px; display: flex; flex-direction: column; gap: 12px\"><h3 style=\"margin: 0; font-size: 22px\">Herramientas digitales<\u002Fh3><p style=\"margin: 0; color: #4f5d6a\">Web apps, asistentes especializados, recursos interactivos y prototipos funcionales.<\u002Fp><\u002Fdiv>\n<div style=\"background: #f8f5ef; border-radius: 24px; padding: 32px; display: flex; flex-direction: column; gap: 12px\"><h3 style=\"margin: 0; font-size: 22px\">Métodos y experiencias<\u002Fh3><p style=\"margin: 0; color: #4f5d6a\">Kits de trabajo, experiencias de aprendizaje y servicios mejorados con IA.<\u002Fp><\u002Fdiv>\n<div style=\"background: #f8f5ef; border-radius: 24px; padding: 32px; display: flex; flex-direction: column; gap: 12px\"><h3 style=\"margin: 0; font-size: 22px\">Soluciones híbridas<\u002Fh3><p style=\"margin: 0; color: #4f5d6a\">Productos físicos con una app, contenidos personalizados o herramientas de seguimiento.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 16px; max-width: 860px\">\n<h3 style=\"margin: 0; font-size: 22px\">Ejemplos ilustrativos<\u002Fh3>\n<ul style=\"margin: 0; padding-left: 24px; display: flex; flex-direction: column; gap: 10px; color: #3a4856\">\n<li>Una arquitecta crea una aplicación para ayudar a particulares a planificar reformas de vivienda.<\u002Fli>\n<li>Una profesora desarrolla un método interactivo para enseñar matemáticas mediante una aplicación.<\u002Fli>\n<li>Una profesional de recursos humanos desarrolla una herramienta para ayudar a pequeñas empresas a mejorar sus procesos de selección.<\u002Fli>\n<li>Una nutricionista diseña una herramienta de planificación alimentaria personalizada.<\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"camino\" style=\"padding: 96px 32px\">\n<div style=\"max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 48px\">\n<div style=\"display: flex; flex-direction: column; gap: 20px; max-width: 760px\">\n<p style=\"margin: 0; font-size: 15px; font-weight: 700; letter-spacing: 2px; color: #17766d\">TU CAMINO<\u002Fp>\n<h2 style=\"margin: 0; font-family: 'Bricolage Grotesque', 'Public Sans', sans-serif; font-weight: 800; font-size: clamp(34px, 4vw, 54px); line-height: 1.08; letter-spacing: -1px\">Del primer día a tu proyecto propio.<\u002Fh2>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px\">\n<div style=\"background: #ffffff; border-radius: 28px; padding: 36px; display: flex; flex-direction: column; gap: 14px; border-top: 8px solid #1f8f84\">\n<p style=\"margin: 0; font-size: 15px; font-weight: 700; letter-spacing: 1px; color: #17766d\">SÁB 14 NOV O SÁB 5 DIC 2026<\u002Fp>\n<h3 style=\"margin: 0; font-family: 'Bricolage Grotesque', 'Public Sans', sans-serif; font-size: 30px\">Aumentadas Lab<\u002Fh3>\n<p style=\"margin: 0; color: #4f5d6a\">Un día completo para crear tu Perfil PIA (Perfil de Inteligencia Aumentada): cómo se ve tu profesión cuando le sumas la IA.<\u002Fp>\n<p style=\"margin: 0; font-weight: 700\">20 €<\u002Fp>\n<\u002Fdiv>\n<div style=\"background: #ffffff; border-radius: 28px; padding: 36px; display: flex; flex-direction: column; gap: 14px; border-top: 8px solid #f07c69\">\n<p style=\"margin: 0; font-size: 15px; font-weight: 700; letter-spacing: 1px; color: #17766d\">ENERO A MARZO 2027<\u002Fp>\n<h3 style=\"margin: 0; font-family: 'Bricolage Grotesque', 'Public Sans', sans-serif; font-size: 30px\">Aumentadas Core<\u002Fh3>\n<p style=\"margin: 0; color: #4f5d6a\">12 semanas presenciales. Creas tu proyecto con prompt engineering y vibe coding, desde tu vocación y tu experiencia.<\u002Fp>\n<p style=\"margin: 0; font-weight: 700\">Con beca parcial o completa<\u002Fp>\n<\u002Fdiv>\n<div style=\"background: #ffffff; border-radius: 28px; padding: 36px; display: flex; flex-direction: column; gap: 14px; border-top: 8px solid #e2b052\">\n<p style=\"margin: 0; font-size: 15px; font-weight: 700; letter-spacing: 1px; color: #17766d\">SEPTIEMBRE A NOVIEMBRE 2027<\u002Fp>\n<h3 style=\"margin: 0; font-family: 'Bricolage Grotesque', 'Public Sans', sans-serif; font-size: 30px\">Aumentadas Pro<\u002Fh3>\n<p style=\"margin: 0; color: #4f5d6a\">12 semanas. Agentes, bots y second brain para orquestar tu emprendimiento.<\u002Fp>\n<p style=\"margin: 0; font-weight: 700\">Para quienes terminan Core<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"background: #ffffff; padding: 96px 32px\">\n<div style=\"max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 48px\">\n<div style=\"display: flex; flex-direction: column; gap: 20px; max-width: 760px\">\n<p style=\"margin: 0; font-size: 15px; font-weight: 700; letter-spacing: 2px; color: #17766d\">POR QUÉ AUMENTADAS<\u002Fp>\n<h2 style=\"margin: 0; font-family: 'Bricolage Grotesque', 'Public Sans', sans-serif; font-weight: 800; font-size: clamp(34px, 4vw, 54px); line-height: 1.08; letter-spacing: -1px\">Emprender no por supervivencia, sino por convicción en lo que sabes hacer.<\u002Fh2>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 24px\">\n<div style=\"display: flex; flex-direction: column; gap: 10px\"><h3 style=\"margin: 0; font-size: 22px\">Una comunidad de migrantes altamente competentes<\u002Fh3><p style=\"margin: 0; color: #4f5d6a\">Todas sabemos lo difícil que es migrar y no conseguir emplearte en lo que mejor sabes hacer.<\u002Fp><\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 10px\"><h3 style=\"margin: 0; font-size: 22px\">Reconocimiento primero<\u002Fh3><p style=\"margin: 0; color: #4f5d6a\">Trabajamos tu identidad profesional antes que la idea de negocio.<\u002Fp><\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 10px\"><h3 style=\"margin: 0; font-size: 22px\">Coaching y mentoría<\u002Fh3><p style=\"margin: 0; color: #4f5d6a\">Acompañamiento emocional, liderazgo y especialistas en producto, IA y negocio.<\u002Fp><\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 10px\"><h3 style=\"margin: 0; font-size: 22px\">IA al servicio de quien eres<\u002Fh3><p style=\"margin: 0; color: #4f5d6a\">Sin programar, sin ser muy tecnológica. Potencia tu talento, no lo reemplaza.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"becas\" style=\"padding: 96px 32px\">\n<div style=\"max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 48px; align-items: center; text-align: center\">\n<div style=\"display: flex; flex-direction: column; gap: 20px; max-width: 760px; align-items: center\">\n<p style=\"margin: 0; font-size: 15px; font-weight: 700; letter-spacing: 2px; color: #17766d\">BECAS 2027<\u002Fp>\n<h2 style=\"margin: 0; font-family: 'Bricolage Grotesque', 'Public Sans', sans-serif; font-weight: 800; font-size: clamp(34px, 4vw, 54px); line-height: 1.08; letter-spacing: -1px\">Que el dinero no sea la razón para no empezar.<\u002Fh2>\n<p style=\"margin: 0; font-size: 20px; color: #3a4856\">Una plaza en Aumentadas Core vale 450 €. Para la primera cohorte, ofrecemos dos tipos de beca.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px; width: 100%; max-width: 900px; text-align: left\">\n<div style=\"background: #ffffff; border-radius: 28px; padding: 40px; display: flex; flex-direction: column; gap: 12px\">\n<p style=\"margin: 0; font-size: 15px; font-weight: 700; letter-spacing: 2px; color: #17766d\">BECA PARCIAL DEL 50 %<\u002Fp>\n<p style=\"margin: 0; font-family: 'Bricolage Grotesque', 'Public Sans', sans-serif; font-weight: 800; font-size: 64px; line-height: 1\">225 €<\u002Fp>\n<p style=\"margin: 0; color: #4f5d6a\">En 3 pagos de 75 €. Aumentadas patrocina la otra mitad de tu plaza.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background: #1d2b3a; color: #f8f5ef; border-radius: 28px; padding: 40px; display: flex; flex-direction: column; gap: 12px\">\n<p style=\"margin: 0; font-size: 15px; font-weight: 700; letter-spacing: 2px; color: #7fd0c6\">BECA COMPLETA<\u002Fp>\n<p style=\"margin: 0; font-family: 'Bricolage Grotesque', 'Public Sans', sans-serif; font-weight: 800; font-size: 64px; line-height: 1\">0 €<\u002Fp>\n<p style=\"margin: 0; color: #d6dde3\">Gracias a entidades patrocinadoras, según disponibilidad.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<a href=\"https://docs.google.com/forms/d/1gylqDV1QrIksuEPeacNqh10lhUTttoYInnpJ0mE20uY/viewform\" target=\"_blank\" rel=\"noopener\" style=\"display: inline-flex; align-items: center; min-height: 56px; padding: 0 36px; border-radius: 999px; background: {{accent}}; color: #ffffff; text-decoration: none; font-weight: 700; font-size: 18px\">Postula a tu beca<\u002Fa>\n<p style=\"margin: 0; font-size: 15px; color: #4f5d6a\">Postular es gratis y te toma 12 minutos. Te escribiremos cuando haya una plaza para ti.<\u002Fp>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"fundadora\" style=\"background: #ffffff; padding: 96px 32px\">\n<div style=\"max-width: 1200px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 56px; align-items: center\">\n<img src=\"bd0a6c7b-c9bc-49fb-a521-1dbfa9611d99\" alt=\"Sandra Alfaro Vargas, fundadora de Aumentadas\" style=\"flex: 1 1 300px; max-width: 420px; width: 100%; aspect-ratio: 4 / 5; object-fit: cover; object-position: 50% 30%; border-radius: 28px; display: block\">\n<div style=\"flex: 999 1 480px; min-width: 0; display: flex; flex-direction: column; gap: 20px\">\n<p style=\"margin: 0; font-size: 15px; font-weight: 700; letter-spacing: 2px; color: #17766d\">QUIÉN ESTÁ DETRÁS<\u002Fp>\n<h2 style=\"margin: 0; font-family: 'Bricolage Grotesque', 'Public Sans', sans-serif; font-weight: 800; font-size: clamp(34px, 4vw, 54px); line-height: 1.08; letter-spacing: -1px\">Soy Sandra Alfaro Vargas. Yo también empecé de nuevo.<\u002Fh2>\n<p style=\"margin: 0; font-size: 19px; color: #3a4856\">Peruana, vivo en Valencia. Llevo más de 10 años formando en comunicación, inteligencia emocional y liderazgo. Tengo un máster en IA aplicada a la educación y diseño cursos corporativos para el uso de la IA.<\u002Fp>\n<p style=\"margin: 0; font-size: 19px; color: #3a4856\">Creé Aumentadas para que ninguna mujer sienta que su experiencia pierde valor por cruzar una frontera.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"padding: 96px 32px\">\n<div style=\"max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 32px\">\n<h2 style=\"margin: 0; font-family: 'Bricolage Grotesque', 'Public Sans', sans-serif; font-weight: 800; font-size: clamp(30px, 3.5vw, 44px); line-height: 1.1\">Preguntas frecuentes<\u002Fh2>\n<div style=\"display: flex; flex-direction: column; gap: 12px\">\n<details style=\"background: #ffffff; border-radius: 20px; padding: 24px 28px\"><summary style=\"font-weight: 700; font-size: 19px\">¿Necesito saber programar o tener experiencia con IA?<\u002Fsummary><p style=\"margin: 12px 0 0; color: #4f5d6a\">Para nada. No es necesario llegar sabiendo programar ni saber de IA. La propuesta parte de tu experiencia y te acompaña a explorar herramientas de IA durante el proceso.<\u002Fp><\u002Fdetails>\n<details style=\"background: #ffffff; border-radius: 20px; padding: 24px 28px\"><summary style=\"font-weight: 700; font-size: 19px\">¿Tengo que tener una idea de negocio definida?<\u002Fsummary><p style=\"margin: 12px 0 0; color: #4f5d6a\">No. Puedes llegar con una inquietud, una habilidad, una experiencia profesional o una idea inicial que quieras desarrollar con IA.<\u002Fp><\u002Fdetails>\n<details style=\"background: #ffffff; border-radius: 20px; padding: 24px 28px\"><summary style=\"font-weight: 700; font-size: 19px\">¿Qué tipo de solución puedo crear?<\u002Fsummary><p style=\"margin: 12px 0 0; color: #4f5d6a\">El proyecto puede ser digital, físico o híbrido, según la necesidad que quieras abordar y lo que descubras durante el proceso. Algunos ejemplos: una arquitecta crea una aplicación para ayudar a particulares a planificar reformas de vivienda; una profesora desarrolla un método interactivo para enseñar matemáticas mediante una aplicación; una profesional de recursos humanos desarrolla una herramienta para ayudar a pequeñas empresas a mejorar sus procesos de selección; una nutricionista diseña una herramienta de planificación alimentaria personalizada.<\u002Fp><\u002Fdetails>\n<details style=\"background: #ffffff; border-radius: 20px; padding: 24px 28px\"><summary style=\"font-weight: 700; font-size: 19px\">¿Qué es el Perfil PIA?<\u002Fsummary><p style=\"margin: 12px 0 0; color: #4f5d6a\">Tu Perfil de Inteligencia Aumentada. Lo creas en el Lab como una guía o un mapa de colaboración con la inteligencia artificial para mejorar y potenciar tus propias competencias profesionales, en lugar de reemplazarlas.<\u002Fp><\u002Fdetails>\n<details style=\"background: #ffffff; border-radius: 20px; padding: 24px 28px\"><summary style=\"font-weight: 700; font-size: 19px\">¿Conseguiré clientes o ingresos al terminar?<\u002Fsummary><p style=\"margin: 12px 0 0; color: #4f5d6a\">Aumentadas te ofrece herramientas prácticas y acompañamiento para ayudarte a crear tus propios productos o servicios y llevarlos al mercado, sacándole el mejor provecho a la IA a partir de tu trayectoria profesional. No podemos garantizar ingresos ni clientes, porque eso dependerá de ti.<\u002Fp><\u002Fdetails>\n<details style=\"background: #ffffff; border-radius: 20px; padding: 24px 28px\"><summary style=\"font-weight: 700; font-size: 19px\">¿Cómo funcionan las becas?<\u002Fsummary><p style=\"margin: 12px 0 0; color: #4f5d6a\">Las postulaciones se revisan mediante el formulario y, cuando corresponda, una conversación con Sandra. La concesión de becas depende de los criterios del proceso y de la disponibilidad de patrocinio.<\u002Fp><\u002Fdetails>\n<details style=\"background: #ffffff; border-radius: 20px; padding: 24px 28px\"><summary style=\"font-weight: 700; font-size: 19px\">¿Postularme significa que ya tengo una plaza?<\u002Fsummary><p style=\"margin: 12px 0 0; color: #4f5d6a\">No. Enviar el formulario expresa tu interés y permite evaluar tu postulación. La selección, la plaza y las condiciones económicas se confirmarán después.<\u002Fp><\u002Fdetails>\n<details style=\"background: #ffffff; border-radius: 20px; padding: 24px 28px\"><summary style=\"font-weight: 700; font-size: 19px\">¿Qué pasa después de postular?<\u002Fsummary><p style=\"margin: 12px 0 0; color: #4f5d6a\">Revisamos tu postulación y te escribimos por email o WhatsApp. Puede que te invitemos a una entrevista con Sandra o te pidamos asistir a uno de nuestros Labs.<\u002Fp><\u002Fdetails>\n<details style=\"background: #ffffff; border-radius: 20px; padding: 24px 28px\"><summary style=\"font-weight: 700; font-size: 19px\">¿En cuánto tiempo sabré si fui elegida como beneficiaria del programa?<\u002Fsummary><p style=\"margin: 12px 0 0; color: #4f5d6a\">En una o dos semanas, después de revisar tu postulación por formulario, entrevista y/o participación en el Lab.<\u002Fp><\u002Fdetails>\n<details style=\"background: #ffffff; border-radius: 20px; padding: 24px 28px\"><summary style=\"font-weight: 700; font-size: 19px\">¿Cuándo y dónde se realizarán los programas?<\u002Fsummary><p style=\"margin: 12px 0 0; color: #4f5d6a\">Presencial, en Valencia. Aumentadas Lab: sábado 14 de noviembre o sábado 5 de diciembre de 2026. Aumentadas Core: de enero a marzo de 2027. Después llegaremos a Barcelona y Madrid.<\u002Fp><\u002Fdetails>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"background: {{accent}}; color: #ffffff; padding: 96px 32px\">\n<div style=\"max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; align-items: center; text-align: center\">\n<h2 style=\"margin: 0; font-family: 'Bricolage Grotesque', 'Public Sans', sans-serif; font-weight: 800; font-size: clamp(36px, 4.5vw, 60px); line-height: 1.05; letter-spacing: -1px\">Tu experiencia sigue valiendo. Empieza a verlo.<\u002Fh2>\n<a href=\"https://docs.google.com/forms/d/1gylqDV1QrIksuEPeacNqh10lhUTttoYInnpJ0mE20uY/viewform\" target=\"_blank\" rel=\"noopener\" style=\"display: inline-flex; align-items: center; min-height: 56px; padding: 0 36px; border-radius: 999px; background: #f8f5ef; color: #1d2b3a; text-decoration: none; font-weight: 700; font-size: 18px\">Postula a tu beca<\u002Fa>\n<\u002Fdiv>\n<\u002Fsection>\n\n<footer style=\"background: #1d2b3a; color: #c9d3dc; padding: 40px 32px\">\n<div style=\"max-width: 1200px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 16px; justify-content: space-between; align-items: center; font-size: 15px\">\n<p style=\"margin: 0\"><strong style=\"color: #f8f5ef; font-family: 'Bricolage Grotesque', 'Public Sans', sans-serif; font-size: 20px\">Aumentadas<\u002Fstrong> · Mujeres emprendedoras aumentadas con IA<\u002Fp>\n<a href=\"https://www.sanalfaro.com\" target=\"_blank\" rel=\"noopener\" style=\"color: #f8f5ef\">sanalfaro.com<\u002Fa>\n<\u002Fdiv>\n<\u002Ffooter>\n\n<\u002Fdiv>\n<sc-if data-dc-static=\"\" value=\"{{ false }}\"><style>x-dc>*{display:none!important}x-dc>[data-dc-static]{display:block!important}<\u002Fstyle>\n\n<div style=\"background: #f8f5ef; color: #1d2b3a; font-family: 'Public Sans', 'Segoe UI', sans-serif; font-size: 18px; line-height: 1.6\" data-canvas-width=\"1440\" data-canvas-height=\"8000\">\n\n<header style=\"max-width: 1200px; margin: 0 auto; padding: 24px 32px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px\">\n<a href=\"#inicio\" style=\"font-family: 'Bricolage Grotesque', 'Public Sans', sans-serif; font-weight: 800; font-size: 28px; color: #1d2b3a; text-decoration: none; letter-spacing: -0.5px\">Aumentadas<\u002Fa>\n<nav aria-label=\"Principal\" style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 24px\">\n<a href=\"#camino\" style=\"color: #1d2b3a; text-decoration: none; font-weight: 500\">Cómo funciona<\u002Fa>\n<a href=\"#becas\" style=\"color: #1d2b3a; text-decoration: none; font-weight: 500\">Becas<\u002Fa>\n<a href=\"#fundadora\" style=\"color: #1d2b3a; text-decoration: none; font-weight: 500\">Sobre mí<\u002Fa>\n<a href=\"https://docs.google.com/forms/d/1gylqDV1QrIksuEPeacNqh10lhUTttoYInnpJ0mE20uY/viewform\" target=\"_blank\" rel=\"noopener\" style=\"display: inline-flex; align-items: center; min-height: 48px; padding: 0 24px; border-radius: 999px; background: #17766d; color: #ffffff; text-decoration: none; font-weight: 700\">Postula a tu beca<\u002Fa>\n<\u002Fnav>\n<\u002Fheader>\n\n<section id=\"inicio\" style=\"max-width: 1200px; margin: 0 auto; padding: 64px 32px 96px; display: flex; flex-wrap: wrap; align-items: center; gap: 64px\">\n<div style=\"flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 28px\">\n<p style=\"margin: 0; font-size: 15px; font-weight: 700; letter-spacing: 2px; color: #17766d\">BECAS 2027 · LABORATORIO PRESENCIAL EN VALENCIA<\u002Fp>\n<h1 style=\"margin: 0; font-family: 'Bricolage Grotesque', 'Public Sans', sans-serif; font-weight: 800; font-size: clamp(44px, 6vw, 80px); line-height: 1.02; letter-spacing: -2px\">Cruzaste una frontera. Tu talento vino contigo.<\u002Fh1>\n<p style=\"margin: 0; font-size: 21px; max-width: 600px; color: #3a4856\">Aumentadas es el laboratorio donde profesionales latinoamericanas en España convierten su experiencia en un proyecto propio, co-creado con inteligencia artificial. Sin saber programar. Sin empezar de cero.<\u002Fp>\n<div style=\"display: flex; flex-wrap: wrap; gap: 16px; align-items: center\">\n<a href=\"https://docs.google.com/forms/d/1gylqDV1QrIksuEPeacNqh10lhUTttoYInnpJ0mE20uY/viewform\" target=\"_blank\" rel=\"noopener\" style=\"display: inline-flex; align-items: center; min-height: 56px; padding: 0 32px; border-radius: 999px; background: #17766d; color: #ffffff; text-decoration: none; font-weight: 700; font-size: 18px\">Postula a tu beca<\u002Fa>\n<a href=\"#camino\" style=\"display: inline-flex; align-items: center; min-height: 56px; padding: 0 28px; border-radius: 999px; border: 2px solid #1d2b3a; color: #1d2b3a; text-decoration: none; font-weight: 700; font-size: 18px\">Ver cómo funciona<\u002Fa>\n<\u002Fdiv>\n<p style=\"margin: 0; font-size: 15px; color: #4f5d6a\">Becas parciales y completas para la primera cohorte · 12 minutos para postular<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex: 1 1 360px; min-width: 0; display: flex; align-items: center; justify-content: center; min-height: 460px; padding: 40px 0\">\n<div style=\"position: relative; width: 340px; max-width: 86%\">\n<div style=\"position: absolute; left: -70px; top: -80px; width: 260px; height: 260px; border-radius: 50%; background: #1f8f84\"><\u002Fdiv>\n<div style=\"position: absolute; right: -50px; bottom: -60px; width: 160px; height: 160px; border-radius: 50%; background: #f07c69\"><\u002Fdiv>\n<div style=\"position: absolute; right: -30px; top: -40px; width: 90px; height: 90px; border-radius: 50%; background: #e2b052\"><\u002Fdiv>\n<div style=\"position: relative; background: #1d2b3a; color: #f8f5ef; border-radius: 28px; padding: 40px 36px; display: flex; flex-direction: column; gap: 18px; box-shadow: 0 24px 48px rgba(29, 43, 58, 0.25)\">\n<p style=\"margin: 0; font-family: 'Bricolage Grotesque', 'Public Sans', sans-serif; font-weight: 800; font-size: 34px; line-height: 1.12\">No enseño IA. Enseño a pensar con IA.<\u002Fp>\n<p style=\"margin: 0; font-size: 15px; color: #c9d3dc\">Sandra Alfaro Vargas, fundadora<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"por-que\" style=\"background: #ffffff; padding: 96px 32px\">\n<div style=\"max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 48px\">\n<div style=\"display: flex; flex-direction: column; gap: 20px; max-width: 760px\">\n<p style=\"margin: 0; font-size: 15px; font-weight: 700; letter-spacing: 2px; color: #17766d\">LA REALIDAD<\u002Fp>\n<h2 style=\"margin: 0; font-family: 'Bricolage Grotesque', 'Public Sans', sans-serif; font-weight: 800; font-size: clamp(34px, 4vw, 54px); line-height: 1.08; letter-spacing: -1px\">El talento no desaparece al migrar.<\u002Fh2>\n<p style=\"margin: 0; font-size: 20px; color: #3a4856\">Llegaste con años de experiencia. Aquí, la homologación, los contactos o el idioma local te cerraron puertas. No te falta talento. Te falta un camino.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 24px\">\n<div style=\"background: #f8f5ef; border-radius: 24px; padding: 32px; display: flex; flex-direction: column; gap: 12px\">\n<p style=\"margin: 0; font-family: 'Bricolage Grotesque', 'Public Sans', sans-serif; font-weight: 800; font-size: 44px; color: #1f8f84; line-height: 1\">01<\u002Fp>\n<h3 style=\"margin: 0; font-size: 22px\">Tu experiencia no se reconoce<\u002Fh3>\n<p style=\"margin: 0; color: #4f5d6a\">Estudios y trayectoria que aquí parecen no contar.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background: #f8f5ef; border-radius: 24px; padding: 32px; display: flex; flex-direction: column; gap: 12px\">\n<p style=\"margin: 0; font-family: 'Bricolage Grotesque', 'Public Sans', sans-serif; font-weight: 800; font-size: 44px; color: #d35a45; line-height: 1\">02<\u002Fp>\n<h3 style=\"margin: 0; font-size: 22px\">Las barreras son reales<\u002Fh3>\n<p style=\"margin: 0; color: #4f5d6a\">Trámites, redes, idioma local y recursos limitados.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background: #f8f5ef; border-radius: 24px; padding: 32px; display: flex; flex-direction: column; gap: 12px\">\n<p style=\"margin: 0; font-family: 'Bricolage Grotesque', 'Public Sans', sans-serif; font-weight: 800; font-size: 44px; color: #b8862a; line-height: 1\">03<\u002Fp>\n<h3 style=\"margin: 0; font-size: 22px\">Pero no quieres renunciar<\u002Fh3>\n<p style=\"margin: 0; color: #4f5d6a\">Quieres volver a ejercer tu talento y crear algo propio.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"background: #1d2b3a; color: #f8f5ef; padding: 96px 32px\">\n<div style=\"max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 48px\">\n<h2 style=\"margin: 0; font-family: 'Bricolage Grotesque', 'Public Sans', sans-serif; font-weight: 800; font-size: clamp(34px, 4vw, 54px); line-height: 1.08; letter-spacing: -1px; max-width: 900px\">De \"mi experiencia no encaja\" a \"puedo crear algo propio\".<\u002Fh2>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px\">\n<div style=\"background: #26384a; border-radius: 24px; padding: 36px; display: flex; flex-direction: column; gap: 12px\">\n<p style=\"margin: 0; font-size: 15px; font-weight: 700; letter-spacing: 2px; color: #f4a294\">ANTES<\u002Fp>\n<p style=\"margin: 0; font-size: 20px; color: #d6dde3\">Desorientación profesional. Un trabajo que no te representa. Poca red de apoyo. Dudas sobre cómo empezar.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background: #26384a; border-radius: 24px; padding: 36px; display: flex; flex-direction: column; gap: 12px\">\n<p style=\"margin: 0; font-size: 15px; font-weight: 700; letter-spacing: 2px; color: #7fd0c6\">DESPUÉS<\u002Fp>\n<p style=\"margin: 0; font-size: 20px; color: #d6dde3\">Reconoces tu talento y tu trayectoria. Creas con IA una solución a un problema. Consigues que personas reales la usen y adquieran tus servicios. Creas comunidad de mujeres migrantes competentes.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"metodo\" style=\"padding: 96px 32px\">\n<div style=\"max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 48px\">\n<div style=\"display: flex; flex-direction: column; gap: 20px; max-width: 760px\">\n<p style=\"margin: 0; font-size: 15px; font-weight: 700; letter-spacing: 2px; color: #17766d\">EL MÉTODO<\u002Fp>\n<h2 style=\"margin: 0; font-family: 'Bricolage Grotesque', 'Public Sans', sans-serif; font-weight: 800; font-size: clamp(34px, 4vw, 54px); line-height: 1.08; letter-spacing: -1px\">Primero tu propio reconocimiento. Después tu producto.<\u002Fh2>\n<p style=\"margin: 0; font-size: 20px; color: #3a4856\">La IA no te reemplaza. Te expande. Trabajamos desde lo que ya sabes hacer.<\u002Fp>\n<\u002Fdiv>\n<ol style=\"margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 20px\">\n<li style=\"background: #ffffff; border-radius: 24px; padding: 28px; display: flex; flex-direction: column; gap: 8px\"><span style=\"font-weight: 700; color: #17766d\">01<\u002Fspan><strong style=\"font-size: 20px\">Experiencia<\u002Fstrong><span style=\"color: #4f5d6a\">Reconoce lo que ya sabes hacer.<\u002Fspan><\u002Fli>\n<li style=\"background: #ffffff; border-radius: 24px; padding: 28px; display: flex; flex-direction: column; gap: 8px\"><span style=\"font-weight: 700; color: #17766d\">02<\u002Fspan><strong style=\"font-size: 20px\">Problema<\u002Fstrong><span style=\"color: #4f5d6a\">Descubre a quién puedes ayudar.<\u002Fspan><\u002Fli>\n<li style=\"background: #ffffff; border-radius: 24px; padding: 28px; display: flex; flex-direction: column; gap: 8px\"><span style=\"font-weight: 700; color: #17766d\">03<\u002Fspan><strong style=\"font-size: 20px\">Idea<\u002Fstrong><span style=\"color: #4f5d6a\">Diseña tu solución.<\u002Fspan><\u002Fli>\n<li style=\"background: #ffffff; border-radius: 24px; padding: 28px; display: flex; flex-direction: column; gap: 8px\"><span style=\"font-weight: 700; color: #17766d\">04<\u002Fspan><strong style=\"font-size: 20px\">IA + creación<\u002Fstrong><span style=\"color: #4f5d6a\">Construye tu primer producto.<\u002Fspan><\u002Fli>\n<li style=\"background: #ffffff; border-radius: 24px; padding: 28px; display: flex; flex-direction: column; gap: 8px\"><span style=\"font-weight: 700; color: #17766d\">05<\u002Fspan><strong style=\"font-size: 20px\">Uso real<\u002Fstrong><span style=\"color: #4f5d6a\">Pruébalo con personas reales y genera ingresos.<\u002Fspan><\u002Fli>\n<\u002Fol>\n<p style=\"margin: 0; font-size: 22px; font-weight: 700; max-width: 820px\">El foco no es dominar herramientas. Es crear algo que una persona real necesite usar, como producto en sí mismo o como complemento de tus servicios profesionales.<\u002Fp>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"background: #ffffff; padding: 96px 32px\">\n<div style=\"max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 48px\">\n<div style=\"display: flex; flex-direction: column; gap: 20px; max-width: 760px\">\n<p style=\"margin: 0; font-size: 15px; font-weight: 700; letter-spacing: 2px; color: #17766d\">QUÉ PUEDES CREAR<\u002Fp>\n<h2 style=\"margin: 0; font-family: 'Bricolage Grotesque', 'Public Sans', sans-serif; font-weight: 800; font-size: clamp(34px, 4vw, 54px); line-height: 1.08; letter-spacing: -1px\">No tiene que ser un curso.<\u002Fh2>\n<p style=\"margin: 0; font-size: 20px; color: #3a4856\">La propuesta no limita la creación a cursos ni a productos exclusivamente digitales. Las participantes podrán explorar distintas soluciones según su experiencia, las necesidades de sus potenciales usuarios y sus recursos.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 24px\">\n<div style=\"background: #f8f5ef; border-radius: 24px; padding: 32px; display: flex; flex-direction: column; gap: 12px\"><h3 style=\"margin: 0; font-size: 22px\">Herramientas digitales<\u002Fh3><p style=\"margin: 0; color: #4f5d6a\">Web apps, asistentes especializados, recursos interactivos y prototipos funcionales.<\u002Fp><\u002Fdiv>\n<div style=\"background: #f8f5ef; border-radius: 24px; padding: 32px; display: flex; flex-direction: column; gap: 12px\"><h3 style=\"margin: 0; font-size: 22px\">Métodos y experiencias<\u002Fh3><p style=\"margin: 0; color: #4f5d6a\">Kits de trabajo, experiencias de aprendizaje y servicios mejorados con IA.<\u002Fp><\u002Fdiv>\n<div style=\"background: #f8f5ef; border-radius: 24px; padding: 32px; display: flex; flex-direction: column; gap: 12px\"><h3 style=\"margin: 0; font-size: 22px\">Soluciones híbridas<\u002Fh3><p style=\"margin: 0; color: #4f5d6a\">Productos físicos con una app, contenidos personalizados o herramientas de seguimiento.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 16px; max-width: 860px\">\n<h3 style=\"margin: 0; font-size: 22px\">Ejemplos ilustrativos<\u002Fh3>\n<ul style=\"margin: 0; padding-left: 24px; display: flex; flex-direction: column; gap: 10px; color: #3a4856\">\n<li>Una arquitecta crea una aplicación para ayudar a particulares a planificar reformas de vivienda.<\u002Fli>\n<li>Una profesora desarrolla un método interactivo para enseñar matemáticas mediante una aplicación.<\u002Fli>\n<li>Una profesional de recursos humanos desarrolla una herramienta para ayudar a pequeñas empresas a mejorar sus procesos de selección.<\u002Fli>\n<li>Una nutricionista diseña una herramienta de planificación alimentaria personalizada.<\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"camino\" style=\"padding: 96px 32px\">\n<div style=\"max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 48px\">\n<div style=\"display: flex; flex-direction: column; gap: 20px; max-width: 760px\">\n<p style=\"margin: 0; font-size: 15px; font-weight: 700; letter-spacing: 2px; color: #17766d\">TU CAMINO<\u002Fp>\n<h2 style=\"margin: 0; font-family: 'Bricolage Grotesque', 'Public Sans', sans-serif; font-weight: 800; font-size: clamp(34px, 4vw, 54px); line-height: 1.08; letter-spacing: -1px\">Del primer día a tu proyecto propio.<\u002Fh2>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px\">\n<div style=\"background: #ffffff; border-radius: 28px; padding: 36px; display: flex; flex-direction: column; gap: 14px; border-top: 8px solid #1f8f84\">\n<p style=\"margin: 0; font-size: 15px; font-weight: 700; letter-spacing: 1px; color: #17766d\">SÁB 14 NOV O SÁB 5 DIC 2026<\u002Fp>\n<h3 style=\"margin: 0; font-family: 'Bricolage Grotesque', 'Public Sans', sans-serif; font-size: 30px\">Aumentadas Lab<\u002Fh3>\n<p style=\"margin: 0; color: #4f5d6a\">Un día completo para crear tu Perfil PIA (Perfil de Inteligencia Aumentada): cómo se ve tu profesión cuando le sumas la IA.<\u002Fp>\n<p style=\"margin: 0; font-weight: 700\">20 €<\u002Fp>\n<\u002Fdiv>\n<div style=\"background: #ffffff; border-radius: 28px; padding: 36px; display: flex; flex-direction: column; gap: 14px; border-top: 8px solid #f07c69\">\n<p style=\"margin: 0; font-size: 15px; font-weight: 700; letter-spacing: 1px; color: #17766d\">ENERO A MARZO 2027<\u002Fp>\n<h3 style=\"margin: 0; font-family: 'Bricolage Grotesque', 'Public Sans', sans-serif; font-size: 30px\">Aumentadas Core<\u002Fh3>\n<p style=\"margin: 0; color: #4f5d6a\">12 semanas presenciales. Creas tu proyecto con prompt engineering y vibe coding, desde tu vocación y tu experiencia.<\u002Fp>\n<p style=\"margin: 0; font-weight: 700\">Con beca parcial o completa<\u002Fp>\n<\u002Fdiv>\n<div style=\"background: #ffffff; border-radius: 28px; padding: 36px; display: flex; flex-direction: column; gap: 14px; border-top: 8px solid #e2b052\">\n<p style=\"margin: 0; font-size: 15px; font-weight: 700; letter-spacing: 1px; color: #17766d\">SEPTIEMBRE A NOVIEMBRE 2027<\u002Fp>\n<h3 style=\"margin: 0; font-family: 'Bricolage Grotesque', 'Public Sans', sans-serif; font-size: 30px\">Aumentadas Pro<\u002Fh3>\n<p style=\"margin: 0; color: #4f5d6a\">12 semanas. Agentes, bots y second brain para orquestar tu emprendimiento.<\u002Fp>\n<p style=\"margin: 0; font-weight: 700\">Para quienes terminan Core<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"background: #ffffff; padding: 96px 32px\">\n<div style=\"max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 48px\">\n<div style=\"display: flex; flex-direction: column; gap: 20px; max-width: 760px\">\n<p style=\"margin: 0; font-size: 15px; font-weight: 700; letter-spacing: 2px; color: #17766d\">POR QUÉ AUMENTADAS<\u002Fp>\n<h2 style=\"margin: 0; font-family: 'Bricolage Grotesque', 'Public Sans', sans-serif; font-weight: 800; font-size: clamp(34px, 4vw, 54px); line-height: 1.08; letter-spacing: -1px\">Emprender no por supervivencia, sino por convicción en lo que sabes hacer.<\u002Fh2>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 24px\">\n<div style=\"display: flex; flex-direction: column; gap: 10px\"><h3 style=\"margin: 0; font-size: 22px\">Una comunidad de migrantes altamente competentes<\u002Fh3><p style=\"margin: 0; color: #4f5d6a\">Todas sabemos lo difícil que es migrar y no conseguir emplearte en lo que mejor sabes hacer.<\u002Fp><\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 10px\"><h3 style=\"margin: 0; font-size: 22px\">Reconocimiento primero<\u002Fh3><p style=\"margin: 0; color: #4f5d6a\">Trabajamos tu identidad profesional antes que la idea de negocio.<\u002Fp><\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 10px\"><h3 style=\"margin: 0; font-size: 22px\">Coaching y mentoría<\u002Fh3><p style=\"margin: 0; color: #4f5d6a\">Acompañamiento emocional, liderazgo y especialistas en producto, IA y negocio.<\u002Fp><\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 10px\"><h3 style=\"margin: 0; font-size: 22px\">IA al servicio de quien eres<\u002Fh3><p style=\"margin: 0; color: #4f5d6a\">Sin programar, sin ser muy tecnológica. Potencia tu talento, no lo reemplaza.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"becas\" style=\"padding: 96px 32px\">\n<div style=\"max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 48px; align-items: center; text-align: center\">\n<div style=\"display: flex; flex-direction: column; gap: 20px; max-width: 760px; align-items: center\">\n<p style=\"margin: 0; font-size: 15px; font-weight: 700; letter-spacing: 2px; color: #17766d\">BECAS 2027<\u002Fp>\n<h2 style=\"margin: 0; font-family: 'Bricolage Grotesque', 'Public Sans', sans-serif; font-weight: 800; font-size: clamp(34px, 4vw, 54px); line-height: 1.08; letter-spacing: -1px\">Que el dinero no sea la razón para no empezar.<\u002Fh2>\n<p style=\"margin: 0; font-size: 20px; color: #3a4856\">Una plaza en Aumentadas Core vale 450 €. Para la primera cohorte, ofrecemos dos tipos de beca.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px; width: 100%; max-width: 900px; text-align: left\">\n<div style=\"background: #ffffff; border-radius: 28px; padding: 40px; display: flex; flex-direction: column; gap: 12px\">\n<p style=\"margin: 0; font-size: 15px; font-weight: 700; letter-spacing: 2px; color: #17766d\">BECA PARCIAL DEL 50 %<\u002Fp>\n<p style=\"margin: 0; font-family: 'Bricolage Grotesque', 'Public Sans', sans-serif; font-weight: 800; font-size: 64px; line-height: 1\">225 €<\u002Fp>\n<p style=\"margin: 0; color: #4f5d6a\">En 3 pagos de 75 €. Aumentadas patrocina la otra mitad de tu plaza.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background: #1d2b3a; color: #f8f5ef; border-radius: 28px; padding: 40px; display: flex; flex-direction: column; gap: 12px\">\n<p style=\"margin: 0; font-size: 15px; font-weight: 700; letter-spacing: 2px; color: #7fd0c6\">BECA COMPLETA<\u002Fp>\n<p style=\"margin: 0; font-family: 'Bricolage Grotesque', 'Public Sans', sans-serif; font-weight: 800; font-size: 64px; line-height: 1\">0 €<\u002Fp>\n<p style=\"margin: 0; color: #d6dde3\">Gracias a entidades patrocinadoras, según disponibilidad.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<a href=\"https://docs.google.com/forms/d/1gylqDV1QrIksuEPeacNqh10lhUTttoYInnpJ0mE20uY/viewform\" target=\"_blank\" rel=\"noopener\" style=\"display: inline-flex; align-items: center; min-height: 56px; padding: 0 36px; border-radius: 999px; background: #17766d; color: #ffffff; text-decoration: none; font-weight: 700; font-size: 18px\">Postula a tu beca<\u002Fa>\n<p style=\"margin: 0; font-size: 15px; color: #4f5d6a\">Postular es gratis y te toma 12 minutos. Te escribiremos cuando haya una plaza para ti.<\u002Fp>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"fundadora\" style=\"background: #ffffff; padding: 96px 32px\">\n<div style=\"max-width: 1200px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 56px; align-items: center\">\n<img src=\"bd0a6c7b-c9bc-49fb-a521-1dbfa9611d99\" alt=\"Sandra Alfaro Vargas, fundadora de Aumentadas\" style=\"flex: 1 1 300px; max-width: 420px; width: 100%; aspect-ratio: 4 / 5; object-fit: cover; object-position: 50% 30%; border-radius: 28px; display: block\">\n<div style=\"flex: 999 1 480px; min-width: 0; display: flex; flex-direction: column; gap: 20px\">\n<p style=\"margin: 0; font-size: 15px; font-weight: 700; letter-spacing: 2px; color: #17766d\">QUIÉN ESTÁ DETRÁS<\u002Fp>\n<h2 style=\"margin: 0; font-family: 'Bricolage Grotesque', 'Public Sans', sans-serif; font-weight: 800; font-size: clamp(34px, 4vw, 54px); line-height: 1.08; letter-spacing: -1px\">Soy Sandra Alfaro Vargas. Yo también empecé de nuevo.<\u002Fh2>\n<p style=\"margin: 0; font-size: 19px; color: #3a4856\">Peruana, vivo en Valencia. Llevo más de 10 años formando en comunicación, inteligencia emocional y liderazgo. Tengo un máster en IA aplicada a la educación y diseño cursos corporativos para el uso de la IA.<\u002Fp>\n<p style=\"margin: 0; font-size: 19px; color: #3a4856\">Creé Aumentadas para que ninguna mujer sienta que su experiencia pierde valor por cruzar una frontera.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"padding: 96px 32px\">\n<div style=\"max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 32px\">\n<h2 style=\"margin: 0; font-family: 'Bricolage Grotesque', 'Public Sans', sans-serif; font-weight: 800; font-size: clamp(30px, 3.5vw, 44px); line-height: 1.1\">Preguntas frecuentes<\u002Fh2>\n<div style=\"display: flex; flex-direction: column; gap: 12px\">\n<details style=\"background: #ffffff; border-radius: 20px; padding: 24px 28px\"><summary style=\"font-weight: 700; font-size: 19px\">¿Necesito saber programar o tener experiencia con IA?<\u002Fsummary><p style=\"margin: 12px 0 0; color: #4f5d6a\">Para nada. No es necesario llegar sabiendo programar ni saber de IA. La propuesta parte de tu experiencia y te acompaña a explorar herramientas de IA durante el proceso.<\u002Fp><\u002Fdetails>\n<details style=\"background: #ffffff; border-radius: 20px; padding: 24px 28px\"><summary style=\"font-weight: 700; font-size: 19px\">¿Tengo que tener una idea de negocio definida?<\u002Fsummary><p style=\"margin: 12px 0 0; color: #4f5d6a\">No. Puedes llegar con una inquietud, una habilidad, una experiencia profesional o una idea inicial que quieras desarrollar con IA.<\u002Fp><\u002Fdetails>\n<details style=\"background: #ffffff; border-radius: 20px; padding: 24px 28px\"><summary style=\"font-weight: 700; font-size: 19px\">¿Qué tipo de solución puedo crear?<\u002Fsummary><p style=\"margin: 12px 0 0; color: #4f5d6a\">El proyecto puede ser digital, físico o híbrido, según la necesidad que quieras abordar y lo que descubras durante el proceso. Algunos ejemplos: una arquitecta crea una aplicación para ayudar a particulares a planificar reformas de vivienda; una profesora desarrolla un método interactivo para enseñar matemáticas mediante una aplicación; una profesional de recursos humanos desarrolla una herramienta para ayudar a pequeñas empresas a mejorar sus procesos de selección; una nutricionista diseña una herramienta de planificación alimentaria personalizada.<\u002Fp><\u002Fdetails>\n<details style=\"background: #ffffff; border-radius: 20px; padding: 24px 28px\"><summary style=\"font-weight: 700; font-size: 19px\">¿Qué es el Perfil PIA?<\u002Fsummary><p style=\"margin: 12px 0 0; color: #4f5d6a\">Tu Perfil de Inteligencia Aumentada. Lo creas en el Lab como una guía o un mapa de colaboración con la inteligencia artificial para mejorar y potenciar tus propias competencias profesionales, en lugar de reemplazarlas.<\u002Fp><\u002Fdetails>\n<details style=\"background: #ffffff; border-radius: 20px; padding: 24px 28px\"><summary style=\"font-weight: 700; font-size: 19px\">¿Conseguiré clientes o ingresos al terminar?<\u002Fsummary><p style=\"margin: 12px 0 0; color: #4f5d6a\">Aumentadas te ofrece herramientas prácticas y acompañamiento para ayudarte a crear tus propios productos o servicios y llevarlos al mercado, sacándole el mejor provecho a la IA a partir de tu trayectoria profesional. No podemos garantizar ingresos ni clientes, porque eso dependerá de ti.<\u002Fp><\u002Fdetails>\n<details style=\"background: #ffffff; border-radius: 20px; padding: 24px 28px\"><summary style=\"font-weight: 700; font-size: 19px\">¿Cómo funcionan las becas?<\u002Fsummary><p style=\"margin: 12px 0 0; color: #4f5d6a\">Las postulaciones se revisan mediante el formulario y, cuando corresponda, una conversación con Sandra. La concesión de becas depende de los criterios del proceso y de la disponibilidad de patrocinio.<\u002Fp><\u002Fdetails>\n<details style=\"background: #ffffff; border-radius: 20px; padding: 24px 28px\"><summary style=\"font-weight: 700; font-size: 19px\">¿Postularme significa que ya tengo una plaza?<\u002Fsummary><p style=\"margin: 12px 0 0; color: #4f5d6a\">No. Enviar el formulario expresa tu interés y permite evaluar tu postulación. La selección, la plaza y las condiciones económicas se confirmarán después.<\u002Fp><\u002Fdetails>\n<details style=\"background: #ffffff; border-radius: 20px; padding: 24px 28px\"><summary style=\"font-weight: 700; font-size: 19px\">¿Qué pasa después de postular?<\u002Fsummary><p style=\"margin: 12px 0 0; color: #4f5d6a\">Revisamos tu postulación y te escribimos por email o WhatsApp. Puede que te invitemos a una entrevista con Sandra o te pidamos asistir a uno de nuestros Labs.<\u002Fp><\u002Fdetails>\n<details style=\"background: #ffffff; border-radius: 20px; padding: 24px 28px\"><summary style=\"font-weight: 700; font-size: 19px\">¿En cuánto tiempo sabré si fui elegida como beneficiaria del programa?<\u002Fsummary><p style=\"margin: 12px 0 0; color: #4f5d6a\">En una o dos semanas, después de revisar tu postulación por formulario, entrevista y/o participación en el Lab.<\u002Fp><\u002Fdetails>\n<details style=\"background: #ffffff; border-radius: 20px; padding: 24px 28px\"><summary style=\"font-weight: 700; font-size: 19px\">¿Cuándo y dónde se realizarán los programas?<\u002Fsummary><p style=\"margin: 12px 0 0; color: #4f5d6a\">Presencial, en Valencia. Aumentadas Lab: sábado 14 de noviembre o sábado 5 de diciembre de 2026. Aumentadas Core: de enero a marzo de 2027. Después llegaremos a Barcelona y Madrid.<\u002Fp><\u002Fdetails>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"background: #17766d; color: #ffffff; padding: 96px 32px\">\n<div style=\"max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; align-items: center; text-align: center\">\n<h2 style=\"margin: 0; font-family: 'Bricolage Grotesque', 'Public Sans', sans-serif; font-weight: 800; font-size: clamp(36px, 4.5vw, 60px); line-height: 1.05; letter-spacing: -1px\">Tu experiencia sigue valiendo. Empieza a verlo.<\u002Fh2>\n<a href=\"https://docs.google.com/forms/d/1gylqDV1QrIksuEPeacNqh10lhUTttoYInnpJ0mE20uY/viewform\" target=\"_blank\" rel=\"noopener\" style=\"display: inline-flex; align-items: center; min-height: 56px; padding: 0 36px; border-radius: 999px; background: #f8f5ef; color: #1d2b3a; text-decoration: none; font-weight: 700; font-size: 18px\">Postula a tu beca<\u002Fa>\n<\u002Fdiv>\n<\u002Fsection>\n\n<footer style=\"background: #1d2b3a; color: #c9d3dc; padding: 40px 32px\">\n<div style=\"max-width: 1200px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 16px; justify-content: space-between; align-items: center; font-size: 15px\">\n<p style=\"margin: 0\"><strong style=\"color: #f8f5ef; font-family: 'Bricolage Grotesque', 'Public Sans', sans-serif; font-size: 20px\">Aumentadas<\u002Fstrong> · Mujeres emprendedoras aumentadas con IA<\u002Fp>\n<a href=\"https://www.sanalfaro.com\" target=\"_blank\" rel=\"noopener\" style=\"color: #f8f5ef\">sanalfaro.com<\u002Fa>\n<\u002Fdiv>\n<\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fsc-if><\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#17766d&quot;,&quot;options&quot;:[&quot;#17766d&quot;,&quot;#1d2b3a&quot;,&quot;#b5452f&quot;]},&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:8500}}\">\nclass Component extends DCLogic {\n  renderVals() {\n    return { accent: this.props.accent ?? '#17766d' };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
